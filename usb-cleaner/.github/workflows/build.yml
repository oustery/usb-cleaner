name: Build and Release

on:
  push:
    branches: [ master, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  PROJECT_NAME: usb-cleaner

jobs:
  # Сборка на Windows с MinGW
  build-windows-mingw:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MinGW-w64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: |
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          git
          unzip
          wget

    - name: Download Nana GUI Library
      shell: msys2 {0}
      run: |
        mkdir -p external/nana
        cd external/nana
        wget https://github.com/cnjinhao/nana/releases/download/v1.7.4/nana-1.7.4.zip -O nana.zip
        unzip nana.zip
        mv nana/* .
        rm -rf nana nana.zip

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DUSE_NANA=ON \
          -DNANA_INSTALL_DIR="${GITHUB_WORKSPACE}/external/nana" \
          -DCMAKE_CXX_FLAGS="-static -DNDEBUG"

    - name: Build
      shell: msys2 {0}
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }} --parallel $(nproc)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: usb-cleaner-windows-mingw64
        path: |
          build/${{ env.PROJECT_NAME }}.exe
        retention-days: 30

  # Сборка на Windows с MSVC
  build-windows-msvc:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download Nana GUI Library
      run: |
        mkdir external\nana
        cd external\nana
        Invoke-WebRequest -Uri "https://github.com/cnjinhao/nana/releases/download/v1.7.4/nana-1.7.4.zip" -OutFile "nana.zip"
        Expand-Archive -Path "nana.zip" -DestinationPath "nana_temp"
        Move-Item "nana_temp\nana\*" "." -Force
        Remove-Item -Recurse -Force "nana_temp", "nana.zip"

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 `
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
        -DUSE_NANA=ON `
        -DNANA_INSTALL_DIR="${{ github.workspace }}\external\nana"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: usb-cleaner-windows-msvc
        path: |
          build/${{ env.BUILD_TYPE }}/${{ env.PROJECT_NAME }}.exe
        retention-days: 30

  # Создание релиза при теге
  release:
    needs: [build-windows-mingw, build-windows-msvc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archives
      run: |
        cd artifacts
        
        # Создаем архив для MinGW версии
        mkdir -p release-mingw
        cp usb-cleaner-windows-mingw64/*.exe release-mingw/
        cp ../../README.md release-mingw/ 2>/dev/null || true
        zip -r ../usb-cleaner-${{ github.ref_name }}-windows-mingw64.zip release-mingw/
        
        # Создаем архив для MSVC версии
        mkdir -p release-msvc
        cp usb-cleaner-windows-msvc/*.exe release-msvc/
        cp ../../README.md release-msvc/ 2>/dev/null || true
        zip -r ../usb-cleaner-${{ github.ref_name }}-windows-msvc.zip release-msvc/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          usb-cleaner-${{ github.ref_name }}-windows-mingw64.zip
          usb-cleaner-${{ github.ref_name }}-windows-msvc.zip
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

  # Сборка на Linux (для проверки компиляции)
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true  # Linux сборка опциональна (только для проверки)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake libx11-dev libxft-dev libasound2-dev

    - name: Download Nana GUI Library
      run: |
        mkdir -p external/nana
        cd external/nana
        wget -q https://github.com/cnjinhao/nana/releases/download/v1.7.4/nana-1.7.4.zip -O nana.zip
        unzip -q nana.zip
        mv nana/* .
        rm -rf nana nana.zip

    - name: Configure CMake
      run: cmake -B build \
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
        -DUSE_NANA=ON \
        -DNANA_INSTALL_DIR="${GITHUB_WORKSPACE}/external/nana"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel $(nproc)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: usb-cleaner-linux
        path: build/usb-cleaner
        retention-days: 7
